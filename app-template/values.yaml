# ---------------------------------------------------------------------------
# platform: set by the platform (the ArgoCD ApplicationSet). App teams never touch it.
# ---------------------------------------------------------------------------
platform:
  domain: example.com
  clusterIssuer: letsencrypt
  storageClasses:
    shared: efs     # EFS, ReadWriteMany (many pods, all zones)
    disk: gp3       # EBS, ReadWriteOnce (one pod at a time)
  ingress:
    namespace: istio-ingress
    serviceDNS: istio-ingress.istio-ingress.svc.cluster.local
    lbHostname: ""

# ---------------------------------------------------------------------------
# app: the app request = the content of apps/<name>/<env>.yaml
# "name" and "env" are set by the ApplicationSet from the folder name and the file name.
# Everything else is optional.
# ---------------------------------------------------------------------------
app:
  name: ""            # required. lowercase letters, digits, "-" (max 30)
  env: ""             # required. one of: dev, staging, prod
  image: nginx:1.27   # container image (pin a version)
  port: 80            # port your container listens on
  replicas: 2
  healthPath: /       # HTTP path used by the readiness and liveness probes
  env_vars: {}        # extra environment variables, e.g. {LOG_LEVEL: debug}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    cpuTarget: 70     # % of the CPU request
  # Optional persistent volume, mounted in every pod of the app. Empty = no volume.
  #   type: shared -> EFS: all replicas read/write the same files, in every zone (uploads, content)
  #   type: disk   -> EBS gp3: fastest, but ONE pod only (replicas: 1, no autoscaling), one zone
  volume: {}
  #  type: shared
  #  size: 5Gi
  #  mountPath: /data
